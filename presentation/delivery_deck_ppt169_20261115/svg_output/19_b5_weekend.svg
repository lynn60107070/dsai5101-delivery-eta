      <use data-icon="tabler-outline/alert-triangle" x="660" y="318" width="36" height="36" fill="#2E6EB8" stroke-width="2"/>
      <text x="712" y="344" font-size="24" fill="#1F2937">Scaling blew up on the Saturday<tspan x="712" dy="34">fold: a flag seen once can't be learned</tspan></text>
    </g>
    <g id="reason-3">
      <use data-icon="tabler-outline/check" x="660" y="428" width="36" height="36" fill="#2E6EB8" stroke-width="2"/>
      <text x="712" y="454" font-size="24" fill="#1F2937">Weekend stays an <tspan font-weight="bold" fill="#102A43">EDA finding</tspan><tspan x="712" dy="34">and a stated limitation</tspan></text>
