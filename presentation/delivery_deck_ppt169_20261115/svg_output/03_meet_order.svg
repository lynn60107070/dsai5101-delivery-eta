<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 300 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">01</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Problem</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1100 64">
    <text x="64" y="142" font-size="42" font-weight="bold" fill="#102A43">Meet <tspan fill="#2E6EB8">order #85188</tspan>: what the app knew at 11:13</text>
  </g>

  <g id="timeline-figure" data-pptx-bounds="64 184 772 444">
    <rect x="64" y="184" width="772" height="444" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/order_timeline.png" x="80" y="200" width="740" height="412" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="order-ticket" data-pptx-bounds="868 184 348 200">
    <rect x="868" y="184" width="348" height="196" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="892" y="208" width="56" height="56" rx="14" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/receipt" x="904" y="220" width="32" height="32" fill="#2E6EB8" stroke-width="2"/>
    <text x="964" y="230" font-size="18" fill="#5B6B7F">Order #85188</text>
    <text x="964" y="258" font-size="24" font-weight="bold" fill="#102A43">Sun 23 Oct · 11:13</text>
    <line x1="892" y1="286" x2="1192" y2="286" stroke="#D5E2F0" stroke-width="1.5" stroke-dasharray="4,4"/>
    <g id="ticket-distance">
      <text x="892" y="322" font-size="18" fill="#5B6B7F">Distance</text>
      <text x="892" y="356" font-size="24" font-weight="bold" fill="#102A43">3.2 km</text>
    </g>
    <g id="ticket-promise">
      <text x="1050" y="322" font-size="18" fill="#5B6B7F">App promise</text>
      <text x="1050" y="356" font-size="24" font-weight="bold" fill="#EB6834">51 min</text>
    </g>
  </g>

  <g id="key-line" data-pptx-bounds="868 404 348 104">
    <text x="868" y="432" font-size="24" fill="#1F2937">We predict how long it<tspan x="868" dy="34"><tspan font-weight="bold" fill="#2E6EB8">actually takes</tspan>, not the</tspan><tspan x="868" dy="34">promise.</tspan></text>
  </g>

  <g id="data-chips" data-pptx-bounds="868 524 348 104">
    <rect x="868" y="524" width="348" height="104" rx="16" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/database" x="888" y="544" width="32" height="32" fill="#2E6EB8" stroke-width="2"/>
    <text x="932" y="568" font-size="24" font-weight="bold" fill="#102A43">546k orders</text>
    <text x="888" y="606" font-size="18" fill="#5B6B7F">8 days · 23 districts</text>
  </g>

  <g id="leak-note" data-pptx-bounds="64 640 772 28">
    <use data-icon="tabler-outline/lock" x="64" y="642" width="22" height="22" fill="#5B6B7F" stroke-width="2"/>
    <text x="94" y="660" font-size="18" fill="#5B6B7F">Anything after the shaded part is the future (leakage), so it is never used.</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time · Data: Meituan INFORMS TSL 2024</text>
    <text x="1216" y="696" text-anchor="end">3</text>
  </g>
</svg>
