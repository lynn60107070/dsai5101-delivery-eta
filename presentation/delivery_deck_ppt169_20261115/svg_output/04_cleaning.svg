<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 360 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">02</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Data &amp; EDA</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 112" font-size="42" font-weight="bold" fill="#102A43">
    <text x="64" y="138">The raw data needed real cleaning:<tspan x="64" dy="52" fill="#2E6EB8">654k rows → 546k orders</tspan></text>
  </g>

  <g id="funnel-figure" data-pptx-bounds="64 232 640 404">
    <rect x="64" y="232" width="640" height="404" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/cleaning_funnel.png" x="80" y="248" width="608" height="372" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="steps" data-pptx-bounds="736 232 480 300">
    <line x1="760" y1="276" x2="760" y2="484" stroke="#A7C7E7" stroke-width="2" stroke-dasharray="4,4"/>
    <g id="step-1">
      <circle cx="760" cy="256" r="22" fill="#102A43"/>
      <text x="760" y="264" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="800" y="262" font-size="24" fill="#102A43"><tspan font-weight="bold">Refused dispatches</tspan> −85,797</text>
      <text x="800" y="290" font-size="18" fill="#5B6B7F">Repeat offers of the same order,<tspan x="800" dy="24">not new orders</tspan></text>
    </g>
    <g id="step-2">
      <circle cx="760" cy="370" r="22" fill="#102A43"/>
      <text x="760" y="378" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="800" y="376" font-size="24" fill="#102A43"><tspan font-weight="bold">Pre-booked</tspan> −22,181</text>
      <text x="800" y="404" font-size="18" fill="#5B6B7F">A different population; holds almost<tspan x="800" dy="24">all deliveries over 3 h</tspan></text>
    </g>
    <g id="step-3">
      <circle cx="760" cy="484" r="22" fill="#102A43"/>
      <text x="760" y="492" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="800" y="490" font-size="24" fill="#102A43"><tspan font-weight="bold">Implausible durations</tspan> −24</text>
      <text x="800" y="518" font-size="18" fill="#5B6B7F">Over 180 minutes</text>
    </g>
  </g>

  <g id="flag-note" data-pptx-bounds="736 544 480 112">
    <rect x="736" y="544" width="480" height="108" rx="16" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/filter" x="756" y="564" width="32" height="32" fill="#2E6EB8" stroke-width="2"/>
    <text x="800" y="578" font-size="18" fill="#102A43"><tspan font-weight="bold">Default prep estimates (13.8%)</tspan><tspan x="800" dy="26">flagged as missing, not dropped</tspan><tspan x="800" dy="26">(not missing at random)</tspan></text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time</text>
    <text x="1216" y="696" text-anchor="end">4</text>
  </g>
</svg>
