<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 360 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">02</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Data &amp; EDA</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 112" font-size="42" font-weight="bold" fill="#102A43">
    <text x="64" y="138">Delivery time rises <tspan fill="#2E6EB8">~7 min per km</tspan>,<tspan x="64" dy="52">in every district</tspan></text>
  </g>

  <g id="distance-figure" data-pptx-bounds="64 232 572 420">
    <rect x="64" y="232" width="572" height="420" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/delivery_vs_distance.png" x="80" y="248" width="540" height="388" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="kpi-per-km" data-pptx-bounds="668 232 260 150">
    <rect x="668" y="232" width="260" height="150" rx="16" fill="#E9F2FA"/>
    <text x="692" y="270" font-size="18" fill="#5B6B7F">Every extra kilometre</text>
    <text x="692" y="346" font-size="64" font-weight="bold" fill="#2E6EB8">+7<tspan font-size="24" fill="#102A43"> min</tspan></text>
  </g>

  <g id="order-ticket" data-pptx-bounds="952 232 264 150">
    <rect x="952" y="232" width="264" height="150" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="972" y="252" width="48" height="48" rx="12" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/receipt" x="982" y="262" width="28" height="28" fill="#2E6EB8" stroke-width="2"/>
    <text x="1032" y="282" font-size="18" fill="#5B6B7F">Order #85188</text>
    <text x="972" y="344" font-size="32" font-weight="bold" fill="#102A43">3.2 km</text>
  </g>

  <g id="points" data-pptx-bounds="668 404 548 140">
    <text x="668" y="432" font-size="24" fill="#1F2937">A friend ordering the same dish from 1 km<tspan x="668" dy="34">away gets it about <tspan font-weight="bold" fill="#102A43">15 minutes sooner</tspan>.</tspan></text>
    <text x="668" y="512" font-size="18" fill="#5B6B7F">Spread grows with distance, so promises need a<tspan x="668" dy="26">higher percentile than the average.</tspan></text>
  </g>

  <g id="insight" data-pptx-bounds="668 564 548 88">
    <rect x="668" y="564" width="548" height="88" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <use data-icon="tabler-outline/bulb" x="688" y="592" width="32" height="32" fill="#2E6EB8" stroke-width="2"/>
    <text x="736" y="602" font-size="18" font-weight="bold" fill="#2E6EB8">Insight</text>
    <text x="736" y="632" font-size="24" fill="#102A43">Distance is the core feature</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time</text>
    <text x="1216" y="696" text-anchor="end">5</text>
  </g>
</svg>
