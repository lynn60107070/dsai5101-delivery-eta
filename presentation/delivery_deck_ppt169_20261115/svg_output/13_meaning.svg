<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 420 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">05</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Conclusion</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 64">
    <text x="64" y="142" font-size="42" font-weight="bold" fill="#102A43">What it means, and <tspan fill="#2E6EB8">what it can't tell us</tspan></text>
  </g>

  <g id="card-answer" data-pptx-bounds="64 184 564 172">
    <rect x="64" y="184" width="564" height="168" rx="16" fill="#102A43"/>
    <rect x="88" y="208" width="52" height="52" rx="12" fill="#2E6EB8"/>
    <use data-icon="tabler-outline/target-arrow" x="100" y="220" width="28" height="28" fill="#FFFFFF" stroke-width="2"/>
    <text x="156" y="242" font-size="18" font-weight="bold" fill="#A7C7E7">ANSWER</text>
    <text x="88" y="296" font-size="24" fill="#FFFFFF">At ordering, delivery time can be predicted<tspan x="88" dy="34">to <tspan font-weight="bold">~6.5 min</tspan>; <tspan font-weight="bold">distance</tspan> is the main driver</tspan></text>
  </g>

  <g id="card-ceiling" data-pptx-bounds="652 184 564 172">
    <rect x="652" y="184" width="564" height="168" rx="16" fill="#E9F2FA"/>
    <rect x="676" y="208" width="52" height="52" rx="12" fill="#FFFFFF"/>
    <use data-icon="tabler-outline/lock" x="688" y="220" width="28" height="28" fill="#2E6EB8" stroke-width="2"/>
    <text x="744" y="242" font-size="18" font-weight="bold" fill="#2E6EB8">THE CEILING IS MISSING INFORMATION</text>
    <text x="676" y="296" font-size="24" fill="#102A43">With after-order times: MAE <tspan font-weight="bold">6.25 → 4.53</tspan>,<tspan x="676" dy="34">R² <tspan font-weight="bold">0.51 → 0.72</tspan> (so R² 0.49 isn't weak)</tspan></text>
  </g>

  <g id="card-limits" data-pptx-bounds="64 372 564 172">
    <rect x="64" y="372" width="564" height="168" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <rect x="88" y="396" width="52" height="52" rx="12" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/alert-triangle" x="100" y="408" width="28" height="28" fill="#2E6EB8" stroke-width="2"/>
    <text x="156" y="430" font-size="18" font-weight="bold" fill="#5B6B7F">LIMITATIONS</text>
    <text x="88" y="484" font-size="24" fill="#1F2937">8 days with one weekend day;<tspan x="88" dy="34">no weather, traffic or courier data</tspan></text>
  </g>

  <g id="card-ethics" data-pptx-bounds="652 372 564 172">
    <rect x="652" y="372" width="564" height="168" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <rect x="676" y="396" width="52" height="52" rx="12" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/user" x="688" y="408" width="28" height="28" fill="#EB6834" stroke-width="2"/>
    <text x="744" y="430" font-size="18" font-weight="bold" fill="#5B6B7F">ETHICS</text>
    <text x="676" y="484" font-size="24" fill="#1F2937">Error is uneven across districts (4.4–9.0);<tspan x="676" dy="34">every minute cut <tspan font-weight="bold" fill="#102A43">lands on a rider</tspan></tspan></text>
  </g>

  <g id="next-steps" data-pptx-bounds="64 564 1152 92">
    <rect x="64" y="564" width="1152" height="88" rx="16" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/route" x="88" y="592" width="32" height="32" fill="#2E6EB8" stroke-width="2"/>
    <text x="136" y="600" font-size="18" font-weight="bold" fill="#2E6EB8">NEXT</text>
    <text x="136" y="632" font-size="24" fill="#102A43">Update the estimate after dispatch · add restaurant history features</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time</text>
    <text x="1216" y="696" text-anchor="end">13</text>
  </g>
</svg>
