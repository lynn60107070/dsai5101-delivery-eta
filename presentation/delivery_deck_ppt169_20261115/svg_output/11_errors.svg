<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 420 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">04</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Results &amp; Insights</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 112" font-size="42" font-weight="bold" fill="#102A43">
    <text x="64" y="138">Our model struggles with <tspan fill="#2E6EB8">long trips</tspan><tspan x="64" dy="52">and the <tspan fill="#2E6EB8">lunch rush</tspan></tspan></text>
  </g>

  <g id="distance-errors" data-pptx-bounds="64 228 560 340">
    <rect x="64" y="228" width="560" height="290" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/errors_by_distance.png" x="80" y="244" width="528" height="258" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="554" font-size="24" fill="#1F2937">&lt; 1 km <tspan font-weight="bold" fill="#2E6EB8">5.6</tspan> vs &gt; 7 km <tspan font-weight="bold" fill="#102A43">14.4 min</tspan></text>
  </g>

  <g id="hour-errors" data-pptx-bounds="656 228 560 340">
    <rect x="656" y="228" width="560" height="290" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/errors_by_hour.png" x="672" y="244" width="528" height="258" preserveAspectRatio="xMidYMid meet"/>
    <text x="656" y="554" font-size="24" fill="#1F2937">11:00 <tspan font-weight="bold" fill="#102A43">7.2</tspan> vs <tspan font-weight="bold" fill="#2E6EB8">6.5 min</tspan> overall</text>
  </g>

  <g id="order-ticket" data-pptx-bounds="64 584 560 80">
    <rect x="64" y="584" width="560" height="76" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="80" y="596" width="52" height="52" rx="12" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/receipt" x="92" y="608" width="28" height="28" fill="#2E6EB8" stroke-width="2"/>
    <text x="148" y="616" font-size="18" fill="#5B6B7F">Orders like #85188 (lunch, 3–5 km)</text>
    <text x="148" y="646" font-size="24" fill="#102A43">ours <tspan font-weight="bold" fill="#2E6EB8">8.4</tspan> vs app <tspan font-weight="bold" fill="#EB6834">11.0 min</tspan></text>
  </g>

  <g id="more-gaps" data-pptx-bounds="656 584 560 80" font-size="18" fill="#5B6B7F">
    <text x="656" y="612">Sunday <tspan font-weight="bold" fill="#102A43">6.77</tspan> vs Monday <tspan font-weight="bold" fill="#102A43">6.17</tspan> min</text>
    <text x="656" y="644">Districts range <tspan font-weight="bold" fill="#102A43">4.4–9.0</tspan> min (test days)</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time · Figures: CV days · numbers in text: test days</text>
    <text x="1216" y="696" text-anchor="end">11</text>
  </g>
</svg>
