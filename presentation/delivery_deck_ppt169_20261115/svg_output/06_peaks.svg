<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 360 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">02</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Data &amp; EDA</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 112" font-size="42" font-weight="bold" fill="#102A43">
    <text x="64" y="138">Slowest at meal peaks:<tspan x="64" dy="52">median <tspan fill="#2E6EB8">33.5 min at 11:00</tspan> vs 27.8 overall</tspan></text>
  </g>

  <g id="hour-figure" data-pptx-bounds="64 232 440 420">
    <rect x="64" y="232" width="440" height="420" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/delivery_by_hour.png" x="80" y="248" width="408" height="388" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="kpi-peak" data-pptx-bounds="536 232 210 150">
    <rect x="536" y="232" width="210" height="150" rx="16" fill="#E9F2FA"/>
    <text x="556" y="268" font-size="18" fill="#5B6B7F">At 11:00 (min)</text>
    <text x="556" y="344" font-size="64" font-weight="bold" fill="#2E6EB8">33.5</text>
  </g>

  <g id="kpi-overall" data-pptx-bounds="762 232 210 150">
    <rect x="762" y="232" width="210" height="150" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <text x="782" y="268" font-size="18" fill="#5B6B7F">Overall (min)</text>
    <text x="782" y="344" font-size="64" font-weight="bold" fill="#102A43">27.8</text>
  </g>

  <g id="order-ticket" data-pptx-bounds="988 232 228 150">
    <rect x="988" y="232" width="228" height="150" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="1008" y="252" width="48" height="48" rx="12" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/receipt" x="1018" y="262" width="28" height="28" fill="#2E6EB8" stroke-width="2"/>
    <text x="1068" y="282" font-size="18" fill="#5B6B7F">#85188</text>
    <text x="1008" y="344" font-size="32" font-weight="bold" fill="#102A43">11:13</text>
  </g>

  <g id="load-point" data-pptx-bounds="536 404 680 100">
    <text x="536" y="436" font-size="24" fill="#1F2937">How busy the area is <tspan font-weight="bold" fill="#102A43">barely matters</tspan><tspan x="536" dy="34">within the same district and hour.</tspan></text>
  </g>

  <g id="insight" data-pptx-bounds="536 524 680 128">
    <rect x="536" y="524" width="680" height="128" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <use data-icon="tabler-outline/bulb" x="556" y="548" width="32" height="32" fill="#2E6EB8" stroke-width="2"/>
    <text x="604" y="570" font-size="18" font-weight="bold" fill="#2E6EB8">Feature</text>
    <text x="604" y="604" font-size="24" fill="#102A43">Lunch/dinner peak flags + cyclical time of day</text>
    <text x="604" y="634" font-size="18" fill="#5B6B7F">so 23:59 sits next to 00:00</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time</text>
    <text x="1216" y="696" text-anchor="end">6</text>
  </g>
</svg>
