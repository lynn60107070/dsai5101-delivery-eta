    <text font-size="24" fill="#102A43" x="96" y="550">Using only information available when an</text><text font-size="24" fill="#102A43" x="96" y="584">order is placed, how accurately can we predict</text><text font-size="24" fill="#102A43" x="96" y="618"><tspan><tspan font-weight="bold">delivery time</tspan>, and what drives long deliveries?</tspan></text></g>

