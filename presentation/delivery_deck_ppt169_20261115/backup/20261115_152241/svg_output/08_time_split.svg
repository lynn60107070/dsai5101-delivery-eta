<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 420 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">03</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Methods &amp; Evaluation</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 112" font-size="42" font-weight="bold" fill="#102A43">
    <text x="64" y="138">Tested like real life: the model<tspan x="64" dy="52">only ever sees <tspan fill="#2E6EB8">the past</tspan></tspan></text>
  </g>

  <g id="split-figure" data-pptx-bounds="64 228 772 408">
    <rect x="64" y="228" width="772" height="376" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/time_split.png" x="80" y="244" width="740" height="344" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="630" font-size="18" fill="#5B6B7F">Forward-chaining CV on 17–22 Oct · test 23–24 Oct scored once</text>
  </g>

  <g id="order-ticket" data-pptx-bounds="868 228 348 96">
    <rect x="868" y="228" width="348" height="92" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="888" y="248" width="52" height="52" rx="12" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/lock" x="900" y="260" width="28" height="28" fill="#2E6EB8" stroke-width="2"/>
    <text x="956" y="268" font-size="18" fill="#5B6B7F">Order #85188 (Sunday)</text>
    <text x="956" y="298" font-size="24" font-weight="bold" fill="#102A43">locked until the end</text>
  </g>

  <g id="points" data-pptx-bounds="868 340 348 132" font-size="18" fill="#1F2937">
    <text x="868" y="364"><tspan font-weight="bold" fill="#102A43">MAE in minutes</tspan>, plus RMSE, R²<tspan x="868" dy="24">and bootstrap 95% CIs</tspan></text>
    <text x="868" y="420"><tspan font-weight="bold" fill="#102A43">Weekend flag dropped</tspan>: only one<tspan x="868" dy="24">weekend day in training</tspan></text>
  </g>

  <g id="no-leak" data-pptx-bounds="868 474 348 54" font-size="18" fill="#1F2937">
    <text x="868" y="494"><tspan font-weight="bold" fill="#102A43">Imputation, scaling, encoding</tspan><tspan x="868" dy="24">refitted per fold: nothing leaks</tspan></text>
  </g>

  <g id="tuning-inset" data-pptx-bounds="868 536 348 128">
    <rect x="868" y="536" width="348" height="124" rx="12" fill="#E9F2FA"/>
    <image href="../images/hgb_complexity_curve.png" x="876" y="544" width="160" height="108" preserveAspectRatio="xMidYMid meet"/>
    <text x="1048" y="570" font-size="18" font-weight="bold" fill="#102A43">Tuning mattered</text>
    <text x="1048" y="598" font-size="18" fill="#5B6B7F">511 leaves:<tspan x="1048" dy="24">train 2.45</tspan><tspan x="1048" dy="24">vs CV 6.63</tspan></text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time</text>
    <text x="1216" y="696" text-anchor="end">8</text>
  </g>
</svg>
