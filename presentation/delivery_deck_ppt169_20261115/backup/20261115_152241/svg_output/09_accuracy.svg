<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="cornerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9F2FA"/>
      <stop offset="100%" stop-color="#A7C7E7"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <circle id="corner-disc" data-pptx-role="decoration" cx="1280" cy="0" r="190" fill="url(#cornerGrad)"/>

  <g id="kicker" data-pptx-bounds="64 52 420 32">
    <text x="64" y="76" font-size="20" font-weight="bold" fill="#102A43">04</text>
    <line x1="100" y1="69" x2="164" y2="69" stroke="#A7C7E7" stroke-width="2"/>
    <text x="180" y="76" font-size="20" fill="#5B6B7F">Results &amp; Insights</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 112" font-size="42" font-weight="bold" fill="#102A43">
    <text x="64" y="138">Our model misses by <tspan fill="#2E6EB8">6.5 min</tspan>:<tspan x="64" dy="52">3.1 min closer than the app's promise</tspan></text>
  </g>

  <g id="order-ticket" data-pptx-bounds="64 224 772 104">
    <rect x="64" y="224" width="772" height="100" rx="16" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="84" y="246" width="56" height="56" rx="14" fill="#E9F2FA"/>
    <use data-icon="tabler-outline/receipt" x="96" y="258" width="32" height="32" fill="#2E6EB8" stroke-width="2"/>
    <g id="ticket-app">
      <text x="164" y="262" font-size="18" fill="#5B6B7F">Order #85188 · app said</text>
      <text x="164" y="302" font-size="32" font-weight="bold" fill="#EB6834">51 min</text>
    </g>
    <g id="ticket-ours">
      <text x="440" y="262" font-size="18" fill="#5B6B7F">our model said</text>
      <text x="440" y="302" font-size="32" font-weight="bold" fill="#2E6EB8">45 min</text>
    </g>
    <g id="ticket-actual">
      <text x="640" y="262" font-size="18" fill="#5B6B7F">it arrived in</text>
      <text x="640" y="302" font-size="32" font-weight="bold" fill="#102A43">43 min</text>
    </g>
  </g>

  <g id="mae-figure" data-pptx-bounds="64 344 772 316">
    <rect x="64" y="344" width="772" height="316" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <image href="../images/test_mae.png" x="80" y="360" width="740" height="284" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="kpi-mae" data-pptx-bounds="868 224 348 160">
    <rect x="868" y="224" width="348" height="156" rx="16" fill="#E9F2FA"/>
    <text x="892" y="262" font-size="18" fill="#5B6B7F">Test MAE, 140,000 orders</text>
    <text x="892" y="338" font-size="64" font-weight="bold" fill="#2E6EB8">6.49<tspan font-size="24" fill="#102A43"> min</tspan></text>
    <text x="892" y="368" font-size="18" fill="#5B6B7F">app 9.62 · median 9.46</text>
  </g>

  <g id="points" data-pptx-bounds="868 400 348 152" font-size="18" fill="#1F2937">
    <text x="868" y="424"><tspan font-weight="bold" fill="#102A43">31% better</tspan> than guessing</text>
    <text x="868" y="458"><tspan font-weight="bold" fill="#102A43">3 models within 0.3 min</tspan>:<tspan x="868" dy="24">the limit is the information</tspan></text>
    <text x="868" y="516"><tspan font-weight="bold" fill="#102A43">Test ≈ CV + 0.2 min</tspan>, same ranking<tspan x="868" dy="24">R² 0.49, shown openly</tspan></text>
  </g>

  <g id="caveat" data-pptx-bounds="868 568 348 92">
    <rect x="868" y="568" width="348" height="92" rx="16" fill="#FFFFFF" stroke="#D5E2F0" stroke-width="1.5"/>
    <use data-icon="tabler-outline/alert-triangle" x="884" y="584" width="28" height="28" fill="#EB6834" stroke-width="2"/>
    <text x="924" y="604" font-size="18" fill="#102A43">The app's promise isn't trying<tspan x="924" dy="24">to be accurate: see slide 12</tspan></text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time · 95% CIs: boosting vs median −2.97 [−3.00, −2.93]; vs RF −0.05 [−0.06, −0.04]</text>
    <text x="1216" y="696" text-anchor="end">9</text>
  </g>
