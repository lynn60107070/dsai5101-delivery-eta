<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, sans-serif" data-pptx-page-role="content">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="kicker" data-pptx-bounds="64 52 420 32">
    <rect x="64" y="52" width="60" height="30" rx="15" fill="#E9F2FA"/>
    <text x="94" y="74" font-size="18" font-weight="bold" fill="#2E6EB8" text-anchor="middle">B11</text>
    <text x="140" y="74" font-size="20" fill="#5B6B7F">Backup · Q&amp;A</text>
  </g>

  <g id="title" data-pptx-bounds="64 96 1000 64">
    <text x="64" y="142" font-size="42" font-weight="bold" fill="#102A43">Scorecard: what we <tspan fill="#2E6EB8">won</tspan> and <tspan fill="#EB6834">lost</tspan></text>
  </g>

  <g id="won" data-pptx-bounds="64 184 1152 300">
    <g id="won-accuracy">
      <rect x="64" y="184" width="1152" height="88" rx="16" fill="#E9F2FA"/>
      <circle cx="112" cy="228" r="24" fill="#2E6EB8"/>
      <use data-icon="tabler-outline/check" x="96" y="212" width="32" height="32" fill="#FFFFFF" stroke-width="3"/>
      <text x="160" y="237" font-size="24" fill="#102A43"><tspan font-weight="bold">Accuracy</tspan>: test MAE 6.49 vs the app's 9.62 min</text>
    </g>
    <g id="won-why">
      <rect x="64" y="290" width="1152" height="88" rx="16" fill="#E9F2FA"/>
      <circle cx="112" cy="334" r="24" fill="#2E6EB8"/>
      <use data-icon="tabler-outline/check" x="96" y="318" width="32" height="32" fill="#FFFFFF" stroke-width="3"/>
      <text x="160" y="343" font-size="24" fill="#102A43"><tspan font-weight="bold">Explains why</tspan>: distance and meal peaks drive delivery time</text>
    </g>
    <g id="won-short">
      <rect x="64" y="396" width="1152" height="88" rx="16" fill="#E9F2FA"/>
      <circle cx="112" cy="440" r="24" fill="#2E6EB8"/>
      <use data-icon="tabler-outline/check" x="96" y="424" width="32" height="32" fill="#FFFFFF" stroke-width="3"/>
      <text x="160" y="449" font-size="24" fill="#102A43"><tspan font-weight="bold">Shorter promises</tspan>: we come out ahead below ~37 min</text>
    </g>
  </g>

  <g id="lost" data-pptx-bounds="64 512 1152 100">
    <rect x="64" y="512" width="1152" height="96" rx="16" fill="#FFFFFF" stroke="#EB6834" stroke-width="2"/>
    <circle cx="112" cy="560" r="24" fill="#EB6834"/>
    <use data-icon="tabler-outline/x" x="96" y="544" width="32" height="32" fill="#FFFFFF" stroke-width="3"/>
    <text x="160" y="569" font-size="24" fill="#102A43"><tspan font-weight="bold">Promises at the app's own length</tspan>: 6.1% vs 5.0% more than 5 min late</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 676 1152 28" font-size="14" fill="#5B6B7F">
    <text x="64" y="696">DSAI 5101 · Predicting food delivery time · Backup</text>
    <text x="1216" y="696" text-anchor="end">25</text>
  </g>
